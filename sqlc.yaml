version: "2"
sql:
  - engine: "postgresql"
    # sqlc parses the golang-migrate files directly and ignores *.down.sql,
    # so the schema here can never drift from what is actually applied.
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # pgtype.UUID is a [16]byte + Valid flag, which is awkward to pass
          # around handlers and serialises poorly. google/uuid is the ergonomic
          # choice and pgx knows how to scan into it.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # ai_score is the only numeric column. pgtype.Numeric is a big.Int +
          # exponent and is painful in handlers; a match score does not need
          # arbitrary precision.
          - column: "applications.ai_score"
            go_type:
              type: "float64"
              pointer: true
